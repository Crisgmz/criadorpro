server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web se sirve comprimido: el bundle baja de varios MB a menos de
    # uno, y en el móvil del criador eso es la diferencia entre abrir y no.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/wasm
        image/svg+xml font/woff2;

    # No declarar aquí un bloque `types`: sustituye el mapa MIME **entero** en
    # este contexto, y todo —incluido index.html— pasa a servirse como
    # `application/octet-stream`. El navegador entonces se niega a ejecutar
    # `main.dart.js` y descarga la página en vez de mostrarla. El mime.types de
    # nginx ya trae `application/wasm`, que es lo único que hacía falta para
    # que `sqlite3.wasm` se instancie.

    # Estos tres deciden qué versión ve el usuario y no pueden guardarse
    # siquiera un momento.
    location ~* ^/(index\.html|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # go_router usa rutas reales (`/birds/123/pedigree`), no fragmentos. Sin
    # este reenvío, recargar en cualquier pantalla que no sea la raíz devuelve
    # un 404 del servidor en vez de abrir la app.
    #
    # **Nada se cachea a un año aquí.** Flutter web no pone hash en los
    # nombres: `main.dart.js`, `flutter_bootstrap.js` y todo `assets/` se
    # llaman igual en cada despliegue y cambian de contenido. Servirlos como
    # `immutable` —que es lo que hacía este archivo— deja al navegador que ya
    # visitó el sitio ejecutando el bundle anterior durante un año, y sin
    # preguntar: `immutable` se salta hasta la recarga normal. Es exactamente
    # lo que hace que un despliegue corregido siga viéndose roto.
    #
    # `no-cache` no dice «no guardes» sino «guarda y pregunta antes de usarlo».
    # Con el ETag que emite nginx, lo que no cambió se responde con un 304 sin
    # cuerpo: la segunda visita sigue costando poco.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }

    # Deliberadamente **no** se activan COOP/COEP. Darían a Drift el modo de
    # almacenamiento más rápido (OPFS con SharedArrayBuffer), pero aislar el
    # origen bloquea las respuestas de Supabase, que no envían
    # `Cross-Origin-Resource-Policy`. Drift funciona igual con IndexedDB, y en
    # un entorno de demostración el almacenamiento no es el cuello de botella.

    # `add_header` no se hereda: en cuanto un `location` declara uno propio,
    # los del `server` desaparecen **enteros** para esa respuesta. De ahí que
    # cada bloque incluya el archivo en lugar de confiar en estas líneas, que
    # solo cubren lo que no cae en ningún `location` con cabeceras.
    include /etc/nginx/conf.d/security-headers.inc;

    location = /favicon.png {
        access_log off;
        log_not_found off;
    }
}
