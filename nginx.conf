server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web se sirve comprimido: el bundle baja de varios MB a menos de
    # uno, y en el móvil del criador eso es la diferencia entre abrir y no.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/wasm
        image/svg+xml font/woff2;

    # No declarar aquí un bloque `types`: sustituye el mapa MIME **entero** en
    # este contexto, y todo —incluido index.html— pasa a servirse como
    # `application/octet-stream`. El navegador entonces se niega a ejecutar
    # `main.dart.js` y descarga la página en vez de mostrarla. El mime.types de
    # nginx ya trae `application/wasm`, que es lo único que hacía falta para
    # que `sqlite3.wasm` se instancie.

    # El contenido con hash en el nombre no cambia nunca: se cachea a un año.
    location ~* \.(?:js|css|woff2|ttf|otf|png|jpg|jpeg|svg|wasm)$ {
        # Solo `add_header`, sin `expires`: cada una emite su propio
        # `Cache-Control` y la respuesta saldría con dos, contradictorias.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Repetido a propósito: `add_header` en un `location` descarta los del
        # `server`, y este es justo donde protege — impide que el navegador
        # adivine el tipo de un script.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Estos tres sí cambian en cada despliegue y deciden qué versión ve el
    # usuario. Cacheados, el criador seguiría viendo la app anterior después de
    # publicar una corrección.
    location ~* ^/(index\.html|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # go_router usa rutas reales (`/birds/123/pedigree`), no fragmentos. Sin
    # este reenvío, recargar en cualquier pantalla que no sea la raíz devuelve
    # un 404 del servidor en vez de abrir la app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deliberadamente **no** se activan COOP/COEP. Darían a Drift el modo de
    # almacenamiento más rápido (OPFS con SharedArrayBuffer), pero aislar el
    # origen bloquea las respuestas de Supabase, que no envían
    # `Cross-Origin-Resource-Policy`. Drift funciona igual con IndexedDB, y en
    # un entorno de demostración el almacenamiento no es el cuello de botella.

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /favicon.png {
        access_log off;
        log_not_found off;
    }
}
