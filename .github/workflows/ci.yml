name: CI

# La compuerta antes de desplegar. Coolify construye desde GitHub, así que lo
# que no se compruebe aquí llega al servidor sin que nadie lo mire.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # La misma versión que fija el Dockerfile: si divergen, CI aprueba
          # algo que el despliegue no puede construir.
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - run: flutter pub get

      # Los generados no se versionan: sin esto no compila nada.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n

      - run: flutter analyze
      # Solo el código escrito a mano. Los `*.g.dart` y las traducciones los
      # produce una herramienta y aquí se generan recién: exigirles formato
      # rompe la compilación por algo que nadie escribió y nadie puede
      # corregir. En local no se notaba porque ya estaban formateados de antes.
      - name: Formato
        run: |
          find lib test -name '*.dart' ! -name '*.g.dart' -not -path '*/generated/*' -print0 \
            | xargs -0 dart format --set-exit-if-changed
      - run: flutter test

      # La única compilación que ejercita `dart2js`. `analyze` y `test` corren
      # contra la VM de Dart, donde `dart:ffi` existe: un import nativo —el de
      # `package:sqlite3` en la base cifrada— pasaba las dos comprobaciones y
      # reventaba el despliegue de Coolify con cientos de «Only JS interop
      # members may be 'external'» que no nombraban ni un archivo del proyecto.
      #
      # Sin `--dart-define`: aquí solo se comprueba que compila, y sin
      # credenciales la app arranca en modo solo local.
      - name: Compilación web
        run: flutter build web --release --no-web-resources-cdn

      # Terminología zootécnica — BRD §8. Un término de riña o apuesta en la
      # interfaz es motivo de rechazo en App Store y Google Play, así que la
      # compuerta corta el despliegue antes de que llegue a una captura.
      #
      # Compara palabras completas (`\b`): «trabajando» contiene «traba» y no
      # tiene nada que ver.
      - name: Terminología prohibida
        run: |
          if grep -rniE '\b(traba|trabas|gallo|gallos|gallera|galleras|pelea|peleas|riña|riñas|apuesta|apuestas|cockfight|rooster)\b' lib/l10n/*.arb; then
            echo "::error::Vocabulario prohibido en los .arb — BRD §8"
            exit 1
          fi
          echo "Sin vocabulario prohibido."
